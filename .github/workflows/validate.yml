name: Validate portfolio

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, agent/portfolio-site-readme]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          # The initial branch has no lockfile to use as a cache key.
          package-manager-cache: false
      - name: Install locked dependencies
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm ci --no-audit --no-fund
      - name: Resolve dependencies and generate the initial lockfile
        if: ${{ hashFiles('package-lock.json') == '' }}
        # Bootstrap only. Commit the real artifact; subsequent runs use npm ci.
        run: npm install --no-audit --no-fund
      - name: Preserve the lockfile used for validation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package-lock-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build worker and verify server rendering
        # npm test runs checkout checks, vinext build, and the local SSR suite.
        run: npm test
